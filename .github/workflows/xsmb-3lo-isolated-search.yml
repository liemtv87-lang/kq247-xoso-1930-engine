name: XSMB isolated 3-lo search
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: xsmb-3lo-isolated-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate input
        run: |
          test -s research/data/xsmb_27_endings.csv
          python - <<'PY'
          import csv
          with open("research/data/xsmb_27_endings.csv",encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)>=600, "Insufficient historical draws"
          assert all(len(r["numbers"].split())==27 for r in rows), "Expected 27 endings per draw"
          print("Validated draws:",len(rows))
          PY
      - name: Run isolated bounded search
        run: python research/xsmb_3lo_search.py --seconds 480 --out research/results/xsmb_3lo_search_progress.json
      - name: Upload search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsmb-3lo-search-${{ github.run_id }}
          path: research/results/xsmb_3lo_search_progress.json
          if-no-files-found: warn
          retention-days: 14
# Research only: never deploy to VPS or change production, bots, or snapshots.
