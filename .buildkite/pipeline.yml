# Buildkite hosted Linux agent. Safe bootstrap: no predictions are published.
# IMPORTANT: configure Buildkite pipeline steps to run "buildkite-agent pipeline upload".
agents:
  queue: "linux-small"
steps:
  - label: ":test_tube: Verify 19:30 Vietnam + 3 regions"
    key: "model-contract"
    command: "node --test test/*.test.mjs"
    timeout_in_minutes: 5
  - label: ":mag: Check current Neon endpoints (read only)"
    key: "preflight"
    depends_on: "model-contract"
    command: "node scripts/preflight.mjs"
    timeout_in_minutes: 5

  - label: ":closed_lock_with_key: Verify unchanged Neon public source"
    key: "neon-original-integrity"
    depends_on: "model-contract"
    command: "node scripts/verify-live-original.mjs"
    timeout_in_minutes: 5

  - label: ":mag: Read-only snapshot readiness (3 lô + ĐB + 3 càng)"
    key: "production-readiness"
    depends_on: "model-contract"
    command: "node scripts/check-production-snapshots.mjs"
    timeout_in_minutes: 5
